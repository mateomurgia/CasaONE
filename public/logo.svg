<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Black background square -->
  <rect width="400" height="400" fill="#000000"/>
  
  <!-- CASA text -->
  <text 
    x="200" 
    y="155" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="72" 
    font-weight="normal"
    fill="#e8d5b0" 
    text-anchor="middle" 
    letter-spacing="8">CASA</text>
  
  <!-- Horizontal line under CASA -->
  <line x1="90" y1="172" x2="310" y2="172" stroke="#e8d5b0" stroke-width="1.5"/>
  
  <!-- UNO text -->
  <text 
    x="200" 
    y="245" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="72" 
    font-weight="normal"
    fill="#e8d5b0" 
    text-anchor="middle" 
    letter-spacing="8">UNO</text>
  
  <!-- Travel Planner italic text -->
  <text 
    x="200" 
    y="295" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="26" 
    font-style="italic"
    font-weight="normal"
    fill="#e8d5b0" 
    text-anchor="middle" 
    letter-spacing="3">Travel Planner</text>
</svg>
